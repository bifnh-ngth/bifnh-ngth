name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # chạy mỗi ngày
  workflow_dispatch:       # cho phép chạy tay trong tab Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#512BD4&color_dots=#ebedf0,#a8dcf7,#5bbcf0,#0D9FEA,#512BD4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8b6cf0&color_dots=#161b22,#0b3a5c,#0a6fb0,#0D9FEA,#7b5cf0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
